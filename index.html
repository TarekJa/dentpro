<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentPro Clinic - عيادة الأسنان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap');
      
        body { font-family: 'Cairo', sans-serif; }
      
        .gold-gradient { background: linear-gradient(135deg, #d4af37, #f1c40f, #e5b80b); }
      
        .nav-link {
            transition: all 0.3s ease;
        }
        .nav-link:hover, .nav-link.active {
            background-color: #1a1a1a;
            color: #f1c40f;
        }
      
        #search-input { height: 52px !important; font-size: 1rem; }
        #search-input::placeholder { color: #9ca3af; }
        
        .date-filter {
            height: 52px;
            background-color: #1f2937;
            border: 2px solid #d4af37;
        }
        
        .amount-paid { color: #10b981 !important; font-weight: 600; }
        .amount-remaining { color: #ef4444 !important; font-weight: 700; }
      
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .mobile-nav { display: flex !important; }
            .search-filter-container { flex-direction: column; gap: 12px; }
           
            th, td { padding: 12px 8px !important; }
        }
        @media (min-width: 769px) {
            .sidebar { display: flex; }
            .mobile-nav { display: none; }
        }
/* ===== GOLD SCROLLBAR ===== */
::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-track {
    background: #0a0a0a;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #d4af37, #f1c40f, #b8860b);
    border-radius: 10px;
    border: 2px solid #0a0a0a;
}

::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #f1c40f, #ffd700, #d4af37);
}

/* Firefox */
* {
    scrollbar-width: thin;
    scrollbar-color: #d4af37 #0a0a0a;
}
/* ===== Remove number input spinners ===== */

/* Chrome, Safari, Edge */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

/* Firefox */
input[type="number"] {
    -moz-appearance: textfield;
}
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

    <!-- Mobile Navigation -->
    <div class="mobile-nav bg-black border-b border-yellow-500 p-4 flex items-center justify-between sticky top-0 z-50 md:hidden">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl gold-gradient flex items-center justify-center text-3xl">🦷</div>
            <h1 class="text-2xl font-bold">DentPro</h1>
        </div>
        <div class="flex gap-6 text-2xl">
            <a href="#" onclick="showSection('patients')" id="m-nav-patients" class="text-yellow-400"><i class="fas fa-users"></i></a>
            <a href="#" onclick="showSection('add')" id="m-nav-add"><i class="fas fa-user-plus"></i></a>
            <a href="#" onclick="showSection('reports')" id="m-nav-reports"><i class="fas fa-chart-bar"></i></a>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- Desktop Sidebar -->
        <div class="sidebar w-72 bg-black border-l-4 border-yellow-500 flex-col hidden md:flex">
            <div class="p-6 border-b border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="w-14 h-14 rounded-3xl gold-gradient flex items-center justify-center text-4xl shadow-2xl shadow-yellow-500/30">🦷</div>
                    <div>
                        <h1 class="text-3xl font-bold tracking-wider">DentPro</h1>
                        <p class="text-yellow-500 text-sm -mt-1">Clinic</p>
                    </div>
                </div>
            </div>
            <div class="flex-1 py-8 px-4 space-y-2 overflow-auto">
                <a href="#" onclick="showSection('patients')" class="nav-link active flex items-center gap-3 px-6 py-4 rounded-2xl text-lg" id="nav-patients">
                    <i class="fas fa-users w-6"></i><span>قائمة المرضى</span>
                </a>
                <a href="#" onclick="showSection('add')" class="nav-link flex items-center gap-3 px-6 py-4 rounded-2xl text-lg" id="nav-add">
                    <i class="fas fa-user-plus w-6"></i><span>إضافة مريض جديد</span>
                </a>
                <a href="#" onclick="showSection('reports')" class="nav-link flex items-center gap-3 px-6 py-4 rounded-2xl text-lg" id="nav-reports">
                    <i class="fas fa-chart-bar w-6"></i><span>التقارير المالية</span>
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <header class="bg-black border-b border-zinc-800 sticky top-0 z-50">
                <div class="px-4 md:px-6 py-5">
                    <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <h2 class="text-2xl md:text-3xl font-bold" id="page-title">قائمة المرضى</h2>
                        
                        <div class="search-filter-container flex flex-col md:flex-row gap-3 w-full md:w-auto">
                            <div class="relative w-full md:w-80">
                                <input id="search-input" type="text" onkeyup="searchPatients()" 
                                       placeholder="ابحث بالاسم أو رقم الهوية أو الهاتف..."
                                       class="bg-zinc-900 border border-zinc-700 rounded-2xl px-6 py-3.5 w-full focus:outline-none focus:border-yellow-500">
                                <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                            </div>
                            
                            <div class="flex items-center gap-3 bg-zinc-800 rounded-3xl px-4 py-3 border border-yellow-500/50 date-filter w-full md:w-auto">
                                <div class="flex items-center gap-2">
                                    <span class="text-yellow-400 text-sm">من</span>
                                    <input id="filter-from" type="date" onchange="applyDateFilter()" class="bg-zinc-900 rounded-2xl px-3 py-2 text-sm">
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-yellow-400 text-sm">إلى</span>
                                    <input id="filter-to" type="date" onchange="applyDateFilter()" class="bg-zinc-900 rounded-2xl px-3 py-2 text-sm">
                                </div>
                                <button onclick="resetDateFilter()" class="text-yellow-400 hover:text-white">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            
                            <button onclick="exportToExcel()" class="flex items-center gap-3 bg-zinc-900 hover:bg-zinc-800 px-6 py-3.5 rounded-2xl border border-yellow-500/30 hover:border-yellow-500">
                                <i class="fas fa-file-excel"></i><span>Excel</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Patients Section -->
            <div id="section-patients" class="p-4 md:p-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-zinc-900 rounded-3xl p-7 card border border-yellow-500/20">
                        <div class="flex justify-between">
                            <div><p class="text-yellow-500">إجمالي المرضى</p><p id="total-patients" class="text-5xl font-bold mt-3">0</p></div>
                            <i class="fas fa-users text-5xl text-yellow-500/20"></i>
                        </div>
                    </div>
                    <div onclick="checkPasswordForStats()" class="bg-zinc-900 rounded-3xl p-7 card border border-yellow-500/20 cursor-pointer">
                        <div class="flex justify-between">
                            <div><p class="text-yellow-500">الديون المتبقية</p><p id="total-debt" class="text-5xl font-bold mt-3 text-red-400">***</p></div>
                            <i class="fas fa-money-bill-wave text-5xl text-yellow-500/20"></i>
                        </div>
                    </div>
                    <div onclick="checkPasswordForStats()" class="bg-zinc-900 rounded-3xl p-7 card border border-yellow-500/20 cursor-pointer">
                        <div class="flex justify-between">
                            <div><p class="text-yellow-500">إيرادات اليوم</p><p id="today-revenue" class="text-5xl font-bold mt-3 text-emerald-400">***</p></div>
                            <i class="fas fa-hand-holding-dollar text-5xl text-yellow-500/20"></i>
                        </div>
                    </div>
                </div>
             
                <div class="bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-700 table-container">
                    <table class="w-full min-w-[750px]">
                        <thead class="bg-black">
                            <tr>
                                <th class="text-right py-5 px-6">رقم الهوية</th>
                                <th class="text-right py-5 px-6">اسم المريض</th>
                                <th class="text-right py-5 px-6">رقم الهاتف</th>
                                <th class="text-right py-5 px-6">التاريخ</th>
                                <th class="text-right py-5 px-6">التكلفة</th>
                                <th class="text-right py-5 px-6">الخصم</th>
                                <th class="text-right py-5 px-6">المدفوع</th>
                                <th class="text-right py-5 px-6">المتبقي</th>
                                <th class="text-right py-5 px-6">الحالة</th>
                                <th class="w-32"></th>
                            </tr>
                        </thead>
                        <tbody id="patients-table" class="divide-y divide-zinc-800"></tbody>
                    </table>
                </div>
            </div>

            <!-- Add Patient Section -->
            <div id="section-add" class="p-8 hidden">
                <div class="max-w-2xl mx-auto">
                    <div class="bg-zinc-900 rounded-3xl p-10 border border-yellow-500/20">
                        <h3 class="text-3xl font-bold mb-10 flex items-center gap-4 text-yellow-400">
                            <i class="fas fa-user-plus"></i> إضافة مريض جديد
                        </h3>
                        <form id="patient-form" onsubmit="addPatient(event)" class="space-y-8">
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm text-zinc-400 mb-2">رقم الهوية الوطنية</label>
                                    <input id="national-id" type="text" required class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                                </div>
                                <div>
                                    <label class="block text-sm text-zinc-400 mb-2">رقم الهاتف</label>
                                    <input id="phone" type="tel" required class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">اسم المريض الكامل</label>
                                <input id="patient-name" type="text" required class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">تاريخ الزيارة</label>
                                <input id="visit-date" type="date" class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">نوع العلاج</label>
                                <input id="treatment" type="text" placeholder="مثال: تنظيف + حشوات + ابتسامة" class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                            </div>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm text-zinc-400 mb-2">تكلفة العلاج ($)</label>
                                    <input id="cost" type="number" min="0" required oninput="calculateRemaining()" class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                                </div>
                                <div>
                                    <label class="block text-sm text-zinc-400 mb-2">نسبة الخصم (%)</label>
                                    <input id="discount-percent" type="number" min="0" max="100" value="0" oninput="calculateRemaining()" class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm text-zinc-400 mb-2">مبلغ الخصم</label>
                                    <input id="discount-amount" type="text" readonly class="w-full bg-zinc-950 border border-yellow-500/40 rounded-2xl px-6 py-4 text-yellow-400 font-bold">
                                </div>
                                <div>
                                    <label class="block text-sm text-zinc-400 mb-2">الدفعة الأولى ($)</label>
                                    <input id="first-payment" type="number" min="0" value="0" oninput="calculateRemaining()" class="w-full bg-black border border-zinc-700 rounded-2xl px-6 py-4 focus:border-yellow-500 outline-none text-lg">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">المبلغ المتبقي</label>
                                <input id="remaining" type="text" readonly class="w-full bg-zinc-950 border border-emerald-500/40 rounded-2xl px-6 py-4 text-emerald-400 font-bold text-xl">
                            </div>
                            <div>
                                <label class="block text-sm text-zinc-400 mb-2">ملاحظات</label>
                                <textarea id="notes" rows="4" class="w-full bg-black border border-zinc-700 rounded-3xl px-6 py-4 focus:border-yellow-500 outline-none"></textarea>
                            </div>
                            <div class="flex gap-4 pt-4">
                                <button type="submit" class="flex-1 bg-yellow-500 hover:bg-amber-400 text-black font-bold py-5 rounded-2xl text-xl">حفظ المريض</button>
                                <button type="button" onclick="resetForm()" class="flex-1 border border-zinc-700 hover:bg-zinc-800 py-5 rounded-2xl text-lg">إلغاء</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Reports Section -->
            <div id="section-reports" class="p-8 hidden">
                <div id="password-prompt" class="text-center py-20">
                    <h3 class="text-2xl mb-6 text-yellow-400">التقارير المالية محمية</h3>
                    <input id="report-password" type="password" placeholder="أدخل كلمة المرور" class="bg-black border border-zinc-700 rounded-2xl px-6 py-4 w-80 text-center text-lg">
                    <button onclick="verifyPassword()" class="mt-4 bg-yellow-500 text-black px-8 py-4 rounded-2xl font-bold">دخول</button>
                </div>
                <div id="report-content" class="hidden"></div>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="details-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
        <div class="bg-zinc-900 w-full max-w-2xl mx-4 rounded-3xl p-8 max-h-[90vh] overflow-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold" id="modal-patient-name"></h3>
                <button onclick="closeDetailsModal()" class="text-3xl text-zinc-500 hover:text-white">×</button>
            </div>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxVeqdee0ihwhr_TOn17icb85YBxGI1wSg4BdI1lxFgpLEHRWWkg3Wfd7xB1E5rWwz9lg/exec";
        let patients = [];
        let currentFilter = { from: null, to: null };
        let statsUnlocked = false;
        const FINANCIAL_PASSWORD = "123456";

        function toLatinNumbers(str) {
            return str.toString().replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 1632);
        }
        function formatDateArabic(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr || Date.now());
if (isNaN(d)) return '';
            return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
        }
        function getCurrentDateTime() {
            const now = new Date();
            return `${formatDateArabic(now.toISOString())} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        }

        async function loadPatients() {
            try {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "getAll" }) });
                patients = await res.json();
                renderPatients();
            } catch (err) {
                console.error(err);
                alert("فشل الاتصال بقاعدة البيانات");
            }
        }

        function getFilteredPatients() {
            let filtered = patients;
            if (currentFilter.from || currentFilter.to) {
                filtered = filtered.filter(p => {
                    const pDate = p.date ? p.date.split('T')[0] : '';
                    if (currentFilter.from && pDate < currentFilter.from) return false;
                    if (currentFilter.to && pDate > currentFilter.to) return false;
                    return true;
                });
            }
            return filtered;
        }

        function renderPatients(searchTerm = '') {
            let data = getFilteredPatients();
            if (searchTerm) {
                const q = searchTerm.toLowerCase().trim();
                data = data.filter(p =>
                    String(p.nationalId || '').toLowerCase().includes(q) ||
                    String(p.name || '').toLowerCase().includes(q) ||
                    String(p.phone || '').toLowerCase().includes(q)
                );
            }
            
            const tbody = document.getElementById('patients-table');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-16 text-zinc-500">لا يوجد نتائج</td></tr>`;
                updateStats();
                return;
            }
            
            data.forEach((p) => {
                const i = patients.indexOf(p);
                const totalPaid = p.payments ? p.payments.reduce((sum, pay) => sum + (pay.amount || 0), 0) : 0;
                const discountAmt = (p.cost * (p.discountPercent || 0)) / 100;
                const remaining = Math.max(0, p.cost - discountAmt - totalPaid);
                
                const status = remaining > 0 ? 
                    `<span class="px-5 py-1.5 bg-red-500/20 text-red-400 rounded-full text-sm">متبقي</span>` : 
                    `<span class="px-5 py-1.5 bg-emerald-500/20 text-emerald-400 rounded-full text-sm">مكتمل</span>`;
                
                const row = document.createElement('tr');
                row.className = "hover:bg-zinc-800/70 transition-colors cursor-pointer";
                row.innerHTML = `
                    <td class="py-5 px-6 font-mono">${p.nationalId}</td>
                    <td class="py-5 px-6 font-semibold">${p.name}</td>
                    <td class="py-5 px-6">${p.phone || '-'}</td>
                    <td class="py-5 px-6">${formatDateArabic(p.date)}</td>
                    <td class="py-5 px-6">${toLatinNumbers(p.cost)}</td>
                    <td class="py-5 px-6 text-yellow-400">${toLatinNumbers(p.discountPercent||0)}%</td>
                    <td class="py-5 px-6 font-medium amount-paid">${toLatinNumbers(totalPaid)}</td>
                    <td class="py-5 px-6 font-bold amount-remaining">${toLatinNumbers(remaining.toFixed(2))}</td>
                    <td class="py-5 px-6">${status}</td>
                    <td class="py-5 px-6">
                        <button onclick="showPatientDetails(${i}); event.stopImmediatePropagation();" class="text-yellow-500 hover:text-yellow-400 mx-2"><i class="fas fa-eye"></i></button>
                        <button onclick="printInvoice(${i}); event.stopImmediatePropagation();" class="text-emerald-500 hover:text-emerald-400 mx-2"><i class="fas fa-print"></i></button>
                    </td>
                `;
                row.onclick = () => showPatientDetails(i);
                tbody.appendChild(row);
            });
            updateStats();
        }

        function searchPatients() {
            const searchTerm = document.getElementById('search-input').value;
            renderPatients(searchTerm);
        }

        function applyDateFilter() {
    currentFilter.from = document.getElementById('filter-from').value;
    currentFilter.to = document.getElementById('filter-to').value;

    resetFinancialCards();

    const searchTerm = document.getElementById('search-input').value;

    renderPatients(searchTerm);

    // 🔥 مهم: تحديث التقارير إذا كانت مفتوحة
    if (!document.getElementById('report-content').classList.contains('hidden')) {
        renderReports();
    }
}

        function resetDateFilter() {
    document.getElementById('filter-from').value = '';
    document.getElementById('filter-to').value = '';
    currentFilter = { from: null, to: null };

    resetFinancialCards();

    const searchTerm = document.getElementById('search-input').value;

    renderPatients(searchTerm);

    if (!document.getElementById('report-content').classList.contains('hidden')) {
        renderReports();
    }
}

        function resetFinancialCards() {
            statsUnlocked = false;
            document.getElementById('total-debt').textContent = '***';
            document.getElementById('today-revenue').textContent = '***';
        }

        function updateStats() {
            const filtered = getFilteredPatients();
            document.getElementById('total-patients').textContent = toLatinNumbers(filtered.length);
            if (statsUnlocked) {
                let totalDebt = 0, todayRev = 0;
                const today = new Date().toISOString().split('T')[0];
                filtered.forEach(p => {
                    const paid = p.payments ? p.payments.reduce((sum, pay) => sum + (pay.amount || 0), 0) : 0;
                    const disc = (p.cost * (p.discountPercent || 0)) / 100;
                    totalDebt += Math.max(0, p.cost - disc - paid);
                    if (p.date && p.date.startsWith(today)) todayRev += paid;
                });
                document.getElementById('total-debt').textContent = toLatinNumbers(totalDebt.toFixed(2)) + " $";
                document.getElementById('today-revenue').textContent = toLatinNumbers(todayRev.toFixed(2)) + " $";
            }
        }

        function checkPasswordForStats() {
            const pass = prompt("أدخل كلمة المرور لعرض البيانات المالية:");
            if (pass === FINANCIAL_PASSWORD) {
                statsUnlocked = true;
                updateStats();
                showToast("تم فتح البيانات المالية");
            } else {
                showToast("كلمة مرور خاطئة");
            }
        }

        async function addPatient(e) {
            e.preventDefault();
            const cost = Math.max(0, parseFloat(document.getElementById('cost').value) || 0);
            const percent = Math.max(0, Math.min(100, parseFloat(document.getElementById('discount-percent').value) || 0));
            const firstPayment = Math.max(0, parseFloat(document.getElementById('first-payment').value) || 0);
            
            const newPatient = {
                nationalId: document.getElementById('national-id').value,
                name: document.getElementById('patient-name').value,
                phone: document.getElementById('phone').value,
                date: document.getElementById('visit-date').value || new Date().toISOString(),
                treatment: document.getElementById('treatment').value,
                cost: cost,
                discountPercent: percent,
                payments: firstPayment > 0 ? [{date: new Date().toISOString(), amount: firstPayment, notes: "دفعة 1"}] : [],
                notes: document.getElementById('notes').value || ""
            };
            
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: "add", patient: newPatient }) });
                showToast("تم إضافة المريض بنجاح ✓");
                resetForm();
                await loadPatients();
                showSection('patients');
            } catch (err) {
                showToast("خطأ في الحفظ");
            }
        }

        function resetForm() {
            document.getElementById('patient-form').reset();
            document.getElementById('visit-date').value = new Date().toISOString().split('T')[0];
            calculateRemaining();
        }

        function calculateRemaining() {
            const cost = Math.max(0, parseFloat(document.getElementById('cost').value) || 0);
            const percent = Math.max(0, Math.min(100, parseFloat(document.getElementById('discount-percent').value) || 0));
            const discountAmount = (cost * percent) / 100;
            const first = Math.max(0, parseFloat(document.getElementById('first-payment').value) || 0);
            document.getElementById('discount-amount').value = toLatinNumbers(discountAmount.toFixed(2)) + " $";
            const remaining = Math.max(0, cost - discountAmount - first);
            document.getElementById('remaining').value = toLatinNumbers(remaining.toFixed(2)) + " $";
        }

        function showPatientDetails(globalIndex) {
            const p = patients[globalIndex];
            const totalPaid = p.payments ? p.payments.reduce((sum, pay) => sum + (pay.amount || 0), 0) : 0;
            const discount = (p.cost * (p.discountPercent || 0)) / 100;
            const remaining = Math.max(0, p.cost - discount - totalPaid);
            
            let paymentsHTML = p.payments && p.payments.length ?
                p.payments.slice().reverse().map(pay => `
                    <div class="flex justify-between py-2 border-b border-zinc-700">
                        <span>${formatDateArabic(pay.date)}</span>
                        <span class="text-emerald-400">${toLatinNumbers(pay.amount)} $</span>
                    </div>
                `).join('') : '<p class="text-zinc-500">لا توجد دفعات بعد</p>';
            
            document.getElementById('modal-patient-name').textContent = p.name;
            document.getElementById('modal-content').innerHTML = `
                <div class="space-y-6">
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div><strong>رقم الهوية:</strong> ${p.nationalId}</div>
                        <div><strong>رقم الهاتف:</strong> ${p.phone || '-'}</div>
                        <div><strong>التكلفة:</strong> ${toLatinNumbers(p.cost)} $</div>
                        <div><strong>الخصم:</strong> ${toLatinNumbers(p.discountPercent||0)}%</div>
                        <div><strong>المدفوع:</strong> <span class="text-emerald-400">${toLatinNumbers(totalPaid)} $</span></div>
                        <div class="col-span-2"><strong>المتبقي:</strong> <span class="text-xl font-bold text-red-500">${toLatinNumbers(remaining.toFixed(2))} $</span></div>
                    </div>
                    <div>
                        <h4 class="font-bold mb-3 text-yellow-400">سجل الدفعات</h4>
                        <div class="bg-black rounded-2xl p-4">${paymentsHTML}</div>
                    </div>
                    <div class="border-t border-zinc-700 pt-6">
                        <h4 class="font-bold mb-3">إضافة دفعة جديدة</h4>
                        <div class="grid grid-cols-2 gap-4">
                            <input id="new-payment-amount" type="number" min="0" placeholder="المبلغ" class="bg-black border border-zinc-700 rounded-2xl px-6 py-4">
                            <input id="new-payment-notes" type="text" placeholder="ملاحظات" class="bg-black border border-zinc-700 rounded-2xl px-6 py-4">
                        </div>
                        <button onclick="addPayment(${globalIndex})" class="mt-4 w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-4 rounded-2xl">إضافة الدفعة</button>
                    </div>
                    <button onclick="printInvoice(${globalIndex})" class="w-full border border-yellow-500 text-yellow-500 hover:bg-yellow-500 hover:text-black py-4 rounded-2xl">طباعة الفاتورة</button>
                </div>
            `;
            document.getElementById('details-modal').classList.remove('hidden');
        }

        async function addPayment(globalIndex) {
    const p = patients[globalIndex];

    const amount = parseFloat(document.getElementById('new-payment-amount').value) || 0;
    const notes = document.getElementById('new-payment-notes').value || "";

    if (amount <= 0) return showToast("أدخل مبلغ صحيح");

    const totalPaid = (p.payments || []).reduce((sum, pay) => sum + (pay.amount || 0), 0);
    const discount = (p.cost * (p.discountPercent || 0)) / 100;
    const remaining = Math.max(0, p.cost - discount - totalPaid);

    if (amount > remaining) {
        return showToast(`❌ المتبقي فقط: ${toLatinNumbers(remaining.toFixed(2))} $`);
    }

    if (!p.payments) p.payments = [];

    p.payments.push({
        date: new Date().toISOString(),
        amount: amount,
        notes: notes || `دفعة ${p.payments.length + 1}`
    });

    try {
        await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "update", patient: p })
        });

        await loadPatients();
        closeDetailsModal();
        showToast("تم إضافة الدفعة بنجاح");
    } catch (err) {
        showToast("فشل حفظ الدفعة");
    }
}

        function closeDetailsModal() {
            document.getElementById('details-modal').classList.add('hidden');
        }

        function printInvoice(globalIndex) {
            const p = patients[globalIndex];
            const discountPercent = p.discountPercent || 0;
            const discountAmount = (p.cost * discountPercent) / 100;
            const totalPaid = p.payments ? p.payments.reduce((sum, pay) => sum + (pay.amount || 0), 0) : 0;
            const remaining = Math.max(0, p.cost - discountAmount - totalPaid);
            
            let paymentsTable = p.payments && p.payments.length ?
                p.payments.slice().reverse().map(pay => `
                    <tr><td>${formatDateArabic(pay.date)}</td><td>${toLatinNumbers(pay.amount)} $</td><td>${pay.notes || '-'}</td></tr>
                `).join('') : '';
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html dir="rtl"><head><title>فاتورة - ${p.name}</title>
                <style>
                    body{font-family:'Cairo',sans-serif;padding:40px;max-width:800px;margin:auto}
                    .gold{color:#d4af37;font-size:42px;text-align:center}
                    table{width:100%;border-collapse:collapse;margin:20px 0}
                    th,td{border:1px solid #ddd;padding:10px;text-align:center}
                    th{background:#f1c40f;color:black}
                    .header-date { position:absolute; top:30px; left:40px; font-size:14px; color:#555; }
                </style>
                </head><body>
                <div class="header-date">تاريخ الطباعة: ${getCurrentDateTime()}</div>
                <h1 class="gold">DentPro Clinic</h1>
                <p class="text-center text-xl">عيادة طب الأسنان الفاخرة</p>
                <hr style="margin:25px 0">
                <h2 class="text-2xl">فاتورة علاج</h2>
                <p><strong>الاسم:</strong> ${p.name}</p>
                <p><strong>رقم الهوية:</strong> ${p.nationalId}</p>
                <p><strong>رقم الهاتف:</strong> ${p.phone || '-'}</p>
                <p><strong>التاريخ:</strong> ${formatDateArabic(p.date)}</p>
                <p><strong>التكلفة:</strong> ${toLatinNumbers(p.cost)} $</p>
                <p><strong>نسبة الخصم:</strong> ${toLatinNumbers(discountPercent)}% - المبلغ المخصوم: ${toLatinNumbers(discountAmount.toFixed(2))} $</p>
                <hr>
                <h3 class="mt-6 mb-3">سجل الدفعات (الأحدث أولاً)</h3>
                <table><thead><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظات</th></tr></thead><tbody>${paymentsTable}</tbody></table>
                <p class="text-xl font-bold mt-6">المدفوع: <span style="color:#10b981">${toLatinNumbers(totalPaid)} $</span></p>
                <p class="text-xl font-bold">المتبقي: <span style="color:#ef4444">${toLatinNumbers(remaining.toFixed(2))} $</span></p>
                <hr>
                <p class="mt-10 text-center">شكراً لثقتكم بدنت برو</p>
                </body></html>
            `);
            printWindow.document.close();
            printWindow.print();
        }

        function showSection(sec) {
            document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('hidden'));
            document.getElementById(`section-${sec}`).classList.remove('hidden');
            
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            const navId = document.getElementById(`nav-${sec}`);
            if (navId) navId.classList.add('active');
            
            const titles = {patients: "قائمة المرضى", add: "إضافة مريض جديد", reports: "التقارير المالية"};
            document.getElementById('page-title').textContent = titles[sec];
            
            if (sec === 'patients') renderPatients(document.getElementById('search-input').value);
            if (sec === 'reports') {
                document.getElementById('password-prompt').classList.remove('hidden');
                document.getElementById('report-content').classList.add('hidden');
            }
        }

        function verifyPassword() {
            if (document.getElementById('report-password').value === FINANCIAL_PASSWORD) {
                renderReports();
            } else {
                showToast("كلمة مرور خاطئة");
            }
        }

        function renderReports() {
            const filtered = getFilteredPatients();
            const totalRev = filtered.reduce((a, p) => a + (p.payments ? p.payments.reduce((s, pay) => s + (pay.amount || 0), 0) : 0), 0);
            const totalDebt = filtered.reduce((a, p) => {
                const disc = (p.cost * (p.discountPercent||0))/100;
                const paid = p.payments ? p.payments.reduce((s, pay) => s + (pay.amount || 0), 0) : 0;
                return a + Math.max(0, p.cost - disc - paid);
            }, 0);
            
            const centerShare = totalRev * 0.15;
            const tariqShare = totalRev * 0.35;
            const malhamShare = totalRev * 0.50;

            document.getElementById('password-prompt').classList.add('hidden');
            document.getElementById('report-content').classList.remove('hidden');
            document.getElementById('report-content').innerHTML = `
                <div class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-black p-8 rounded-3xl text-center border border-emerald-500/30">
                            <p class="text-emerald-400">إجمالي الإيرادات</p>
                            <p class="text-6xl font-bold mt-3 text-emerald-400">${toLatinNumbers(totalRev.toFixed(2))} $</p>
                        </div>
                        <div class="bg-black p-8 rounded-3xl text-center border border-red-500/30">
                            <p class="text-red-400">إجمالي الديون المتبقية</p>
                            <p class="text-6xl font-bold mt-3 text-red-400">${toLatinNumbers(totalDebt.toFixed(2))} $</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-zinc-900 p-8 rounded-3xl text-center border border-yellow-500/30">
                            <p class="text-yellow-400">المركز (15%)</p>
                            <p class="text-4xl font-bold mt-4">${toLatinNumbers(centerShare.toFixed(2))} $</p>
                        </div>
                        <div class="bg-zinc-900 p-8 rounded-3xl text-center border border-sky-500/30">
                            <p class="text-sky-400">طارق (35%)</p>
                            <p class="text-4xl font-bold mt-4">${toLatinNumbers(tariqShare.toFixed(2))} $</p>
                        </div>
                        <div class="bg-zinc-900 p-8 rounded-3xl text-center border border-violet-500/30">
                            <p class="text-violet-400">ملهم (50%)</p>
                            <p class="text-4xl font-bold mt-4">${toLatinNumbers(malhamShare.toFixed(2))} $</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function exportToExcel() {
            const filtered = getFilteredPatients();
            const data = filtered.map(p => {
                const totalPaid = p.payments ? p.payments.reduce((sum, pay) => sum + (pay.amount || 0), 0) : 0;
                const discount = (p.cost * (p.discountPercent || 0)) / 100;
                return {
                    "رقم الهوية": p.nationalId,
                    "الاسم": p.name,
                    "رقم الهاتف": p.phone,
                    "التاريخ": formatDateArabic(p.date),
                    "نوع العلاج": p.treatment,
                    "التكلفة": p.cost,
                    "نسبة الخصم": p.discountPercent,
                    "المدفوع": totalPaid,
                    "المتبقي": Math.max(0, p.cost - discount - totalPaid)
                };
            });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "المرضى");
            XLSX.writeFile(wb, `DentPro_Patients_${new Date().toISOString().slice(0,10)}.xlsx`);
            showToast("تم تصدير الملف بنجاح");
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#f1c40f; color:black; padding:14px 28px; border-radius:9999px; font-weight:600; z-index:9999;`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        window.onload = async () => {
            document.getElementById('visit-date').value = new Date().toISOString().split('T')[0];
            await loadPatients();
            showSection('patients');
        };
    </script>
</body>
</html>
